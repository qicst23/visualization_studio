# Pan-Cancer Surface Antigen IHC/RNA Prevalence, Lineage Plasticity & Clinical Benchmark Atlas
# for Amgen Bispecific T-Cell Engagers (BiTEs):
#   1. Tarlatamab-dlle (IMDELLTRA / AMG 757): Half-life extended DLL3 x CD3 BiTE
#   2. Xaluritamig (AMG 509): XmAb 2+1 STEAP1 x CD3 T-cell engager
#
# All prevalence percentages reflect peer-reviewed immunohistochemistry (IHC >=1% positivity and
# >=50% high-expression cohorts) and prospective clinical trial disclosures (2020-2026).

version: "5.3-2026-11"

tcell_effector_genes:
  - CD3D
  - CD3E
  - CD3G
  - CD247

lymphoid_heme_taas:
  - CD19
  - MS4A1
  - CD22
  - TNFRSF17
  - GPRC5D
  - FCRL5
  - CD33
  - IL3RA
  - CLEC12A
  - FLT3
  - CD38
  - SLAMF7

congenital_germline_lof_regex_patterns:
  - "dysostosis"
  - "spondylocostal"
  - "spondylothoracic"
  - "congenital disorder of glycosylation"
  - "severe combined immunodeficiency"
  - "combined immunodeficiency"
  - "agammaglobulinemia"
  - "inborn error"
  - "malformation syndrome"
  - "autosomal recessive.*immunodeficiency"

crs_icans_management:
  tarlatamab:
    boxed_warnings:
      - "Cytokine Release Syndrome (CRS)"
      - "Neurologic Toxicity including Immune Effector Cell-Associated Neurotoxicity Syndrome (ICANS)"
    fda_monitoring_update_2026_09: >-
      Sept 2026 FDA label update shortened mandatory healthcare-facility monitoring for Cycle 1 Day 1 (1 mg step-up)
      and Cycle 1 Day 8 (10 mg) infusions to 6-8 hours (down from 22-24h inpatient), provided patients remain within
      1 hour of an appropriate healthcare setting for 48 hours post-infusion with caregiver accompaniment.
    dosing_evolution:
      approved_iv_regimen: "Cycle 1 Day 1: 1 mg IV step-up -> Day 8: 10 mg IV -> Day 15: 10 mg IV, then 10 mg Q2W"
      extended_interval_dellphi_309: "DeLLphi-309 (WCLC 2026): 20 mg IV Q3W or 30 mg IV Q4W post step-up (comparable PK/ORR/safety)"
      subcutaneous_dellphi_308: "DeLLphi-308 (Phase 1b): Subcutaneous (SC) tarlatamab reducing peak Cmax cytokine spikes"
    pharmacologic_mitigation_agents:
      - drug_name: "Tocilizumab"
        node_id: "DRUGBANK:DB06273"
        target: "IL6R"
        role: "First-line Grade >=2 CRS blockade (anti-IL-6R mAb) without ablating BiTE T-cell cytotoxicity"
      - drug_name: "Siltuximab"
        node_id: "DRUGBANK:DB09036"
        target: "IL6"
        role: "Direct IL-6 cytokine neutralization for tocilizumab-refractory CRS"
      - drug_name: "Anakinra"
        node_id: "DRUGBANK:DB00026"
        target: "IL1R1"
        role: "Second-line IL-1R1 antagonist for steroid-refractory ICANS (low passive CSF penetration ~0.3%-4%; requires high-dose IV dosing per ASTCT/NCCN practice)"
      - drug_name: "Dexamethasone"
        node_id: "CHEMBL384467"
        target: "NR3C1"
        role: "Pre-medication & acute CRS/ICANS corticosteroid control"

bite_programs:
  DLL3:
    anchor_asset_key: "tarlatamab"
    anchor_drug_id: "CHEMBL5095292"
    brand_name: "IMDELLTRA (tarlatamab-dlle / AMG 757)"
    approved_anchor_disease_ids:
      - "EFO_0000702"   # small cell lung carcinoma
      - "MONDO_0008433" # small cell lung carcinoma
      - "MONDO_0003438" # combined small cell lung carcinoma
    lineage_transcription_genes:
      ASCL1: 0.42
      INSM1: 0.38
      SYP: 0.22
      CHGA: 0.20
      NCAM1: 0.18
      MYCN: 0.20
      IDH1: 0.22
      RET: 0.18
      RB1: 0.16
    resistance_and_escape_genes:
      - gene: "EZH2"
        mechanism: "PRC2 H3K27me3 epigenetic silencing of ASCL1/DLL3 & MHC-I antigen presentation (reversible by Tazemetostat)"
      - gene: "KDM1A"
        mechanism: "LSD1 chromatin remodeling driving SCLC-A -> SCLC-Y/P non-neuroendocrine plasticity & DLL3 downregulation"
      - gene: "NOTCH1"
        mechanism: "Active Notch1 intracellular signaling switches neuroendocrine ASCL1high/DLL3+ cells into REST+/DLL3- fate"
      - gene: "YAP1"
        mechanism: "Hippo/YAP1 inflamed/mesenchymal state with minimal surface DLL3 expression (SCLC-Y)"
      - gene: "POU2F3"
        mechanism: "Tuft-cell-like SCLC-P lineage lacking ASCL1-driven DLL3 transcription"
      - gene: "CD274"
        mechanism: "IFN-gamma induced adaptive PD-L1 upregulation on tumor/myeloid cells following BiTE T-cell engagement (DeLLphi-305 rationale)"

    clinical_trials_2025_2026:
      - trial_id: "DeLLphi-301 (NCT05060016)"
        phase: "Phase 2 (Accelerated Approval May 2024)"
        indication: "2L+ ES-SCLC"
        key_readout: "ORR 40% (10 mg Q2W), median DOR 9.7 mo, mOS 15.2 mo"
      - trial_id: "DeLLphi-304 (NCT05740566)"
        phase: "Phase 3 Confirmatory (Full FDA Approval Nov 2025)"
        indication: "2L ES-SCLC post-platinum"
        key_readout: "mOS 13.6 mo vs 8.3 mo SOC chemo (topotecan/lurbinectedin/amrubicin), HR 0.60"
      - trial_id: "DeLLphi-305 (NCT06211036)"
        phase: "Phase 3 Landmark (NEJM / ESMO Oct 2026)"
        indication: "1L Maintenance ES-SCLC (Tarlatamab + Durvalumab vs Durvalumab)"
        key_readout: "mOS 21.1 mo vs 12.7 mo (HR 0.42, p<0.0001); mPFS 7.4 mo vs 1.9 mo"
      - trial_id: "DeLLphi-306 (NCT06117774)"
        phase: "Phase 3 Ongoing"
        indication: "Limited-Stage SCLC (LS-SCLC) post-concurrent chemoradiation"
        key_readout: "Curative-intent consolidation evaluating Tarlatamab after cCRT"
      - trial_id: "DeLLpro-300 (NCT04702737)"
        phase: "Phase 1b Completed Readout"
        indication: "Metastatic de novo or treatment-emergent NEPC"
        key_readout: "Overall ORR 10.5% (n=38); DLL3+ (>=1% IHC) ORR 22.2%, mOS 9.8 mo, mPFS 3.7 mo vs DLL3-negative ORR 0.0%!"
      - trial_id: "NCT06788938 / NCT07788365 (Pan-EPNEC & MTC Baskets)"
        phase: "Phase 2 Recruiting (2025-2026)"
        indication: "DLL3-expressing extrapulmonary neuroendocrine carcinomas (EPNEC) & medullary thyroid carcinoma"
        key_readout: "Prospective pan-cancer biomarker-selected DLL3+ EPNEC & C-cell NEC expansion baskets"
      - trial_id: "NCT06814496 (MCC)"
        phase: "Phase 2 Investigator-Initiated / Cooperative Recruiting (2025-2026)"
        indication: "Refractory Merkel cell carcinoma (MCC)"
        key_readout: "Evaluates DLL3xCD3 T-cell redirection in post-PD-(L)1 cutaneous neuroendocrine carcinoma"
      - trial_id: "DeLLphi-308 / DeLLphi-309"
        phase: "Phase 1b / Phase 2 (WCLC 2026)"
        indication: "Outpatient SC formulation & Q3W (20 mg) / Q4W (30 mg) extended dosing"
        key_readout: "Enables community-oncology administration alongside 6-8h Cycle 1 monitoring"

