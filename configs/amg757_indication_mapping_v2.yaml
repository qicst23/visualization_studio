# Single Canonical Indication Mapping & Subtype Hygiene Registry for AMG 757 / Tarlatamab (DLL3 x CD3)
# Serves as the single source of truth across:
#   1. optimus_txgnn/bite_biomarker_and_expansion.py (IHC surface gating & family deduplication)
#   2. optimus_txgnn/option1_protocol_and_omics.py (within-platform omics & ClinicalTrials.gov landscape)
#   3. run_amgen_goal1_and_goal2_pipeline.py (Option-1 protocol ranking & MCDA sensitivity)
#
# Scientific hygiene rules enforced here:
#   - Pediatric / circumscribed IDH-wildtype astrocytomas (pilocytic, pilomyxoid, cerebellar,
#     desmoplastic infantile, childhood brainstem/DIPG, diencephalic, spinal cord, SEGA) NEVER
#     inherit adult IDH1/2-mutant G-CIMP diffuse glioma DLL3 prevalence.
#   - "non-small cell lung" NEVER matches "small cell lung".
#   - MONDO_0016685 ("low-grade astrocytoma") maps to astrocytoma, NEVER oligodendroglioma, and
#     is collapsed into the single adult diffuse astrocytoma family (`idh_mut_diffuse_astrocytoma`)
#     alongside `EFO_0002499` (`anaplastic astrocytoma`) so redundant ontology terms never flood Top-20.
#   - Ontology `disease_name` labels are preserved verbatim; required molecular selection gates
#     are stored separately in `required_molecular_gate`.

schema_version: "amg757-canonical-map-v2.1"

# Circumscribed / Pediatric IDH-Wildtype Glioma Subtypes (BRAF-fusion / H3K27M / TSC1/2)
# Explicitly excluded from adult IDH-mutant G-CIMP DLL3 high-expression priors!
pediatric_or_circumscribed_idh_wt_glioma_ids:
  - "MONDO_0003165"   # cerebellar astrocytoma (predominantly pilocytic BRAF-KIAA1549, IDH-WT)
  - "MONDO_0022963"   # desmoplastic infantile astrocytoma (BRAF/RAF1, infant IDH-WT)
  - "MONDO_0003169"   # diencephalic astrocytomas (optic/hypothalamic BRAF, IDH-WT)
  - "EFO_1000544"     # Spinal Cord Astrocytoma (predominantly H3K27M or BRAF, IDH-WT)
  - "MONDO_0016692"   # pilomyxoid astrocytoma (pediatric BRAF-fusion, IDH-WT)
  - "MONDO_0003870"   # childhood brainstem astrocytoma (H3K27M diffuse midline glioma, IDH-WT)
  - "EFO_0005586"     # pilocytic astrocytoma
  - "MONDO_0016691"   # pilocytic astrocytoma
  - "MONDO_0016693"   # pleomorphic xanthoastrocytoma (BRAF V600E, IDH-WT)
  - "MONDO_0016690"   # subependymal giant cell astrocytoma (TSC1/TSC2, IDH-WT)

pediatric_or_circumscribed_glioma_keywords:
  - "pilocytic"
  - "pilomyxoid"
  - "cerebellar astrocytoma"
  - "desmoplastic infantile"
  - "childhood brainstem"
  - "brainstem astrocytoma"
  - "brain stem astrocytoma"
  - "diencephalic astrocytoma"
  - "optic nerve glioma"
  - "optic pathway glioma"
  - "spinal cord astrocytoma"
  - "subependymal giant cell"
  - "pleomorphic xanthoastrocytoma"
  - "diffuse midline glioma"

# Confirmed Non-Neuroendocrine DLL3-Low Epithelial Carcinomas (<8% DLL3+ IHC negative controls)
dll3_low_epithelial_control_ids:
  - "EFO_0000641"     # papillary thyroid carcinoma (TCGA-THCA: 0% high DLL3)
  - "EFO_0002892"     # thyroid carcinoma (bulk non-medullary follicular/papillary)
  - "EFO_0003060"     # non-small cell lung carcinoma (untransformed NSCLC: <3% DLL3+)
  - "EFO_0000708"     # squamous cell lung carcinoma
  - "EFO_1000601"     # Transitional Cell Carcinoma (conventional urothelial BLCA)
  - "EFO_0008528"     # urothelial carcinoma (conventional non-neuroendocrine BLCA)
  - "MONDO_0007576"   # esophageal cancer (unselected squamous/adeno)
  - "EFO_0001061"     # cervical carcinoma (unselected non-NE squamous/adeno)
  - "MONDO_0000956"   # malignant neoplasm of small intestine (unselected non-NEC)
  - "EFO_1001512"     # endometrial carcinoma (unselected non-NEC)
  - "EFO_0000349"     # clear cell renal carcinoma
  - "EFO_0000640"     # papillary renal cell carcinoma
  - "EFO_0000681"     # renal cell carcinoma
  - "EFO_0000199"     # oral squamous cell carcinoma
  - "EFO_0006352"     # laryngeal squamous cell carcinoma

